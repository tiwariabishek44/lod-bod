name: lod_board
description: "LoadBoard shipper application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  responsive_sizer: ^3.3.1
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/lodbod_nepal_splash_background.png
    - assets/images/bid_sheet_banner.png
    - assets/images/bid_confirmation_illustration.png
    - assets/images/leave_load_illustration.png
    - assets/images/shipment_details_mountains.png
    - assets/images/auth/
    - assets/images/home/
    - assets/images/onboarding/
